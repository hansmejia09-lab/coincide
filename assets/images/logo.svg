<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Logotipo de COINCIDE</title>
  <desc id="logoDesc">Siluetas de una familia y una taza de café dentro de un trazo en forma de C, con el lema Trabajo, Café y Crianza.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF7F1"/>
      <stop offset="1" stop-color="#F2EFE6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" rx="48" fill="url(#bgGrad)"/>

  <!-- C trace -->
  <path d="M 430 150 A 170 170 0 1 0 430 490" fill="none" stroke="#2C6E68" stroke-width="26" stroke-linecap="round"/>
  <!-- Orange overlapping circle accent -->
  <circle cx="330" cy="200" r="48" fill="none" stroke="#E2792E" stroke-width="14"/>
  <circle cx="330" cy="200" r="20" fill="#E2792E"/>

  <!-- Two adult silhouettes -->
  <g fill="#1F4F4B">
    <circle cx="255" cy="300" r="30"/>
    <path d="M205 400 q50-55 100 0 v40 h-100 z"/>
    <circle cx="345" cy="300" r="30"/>
    <path d="M295 400 q50-55 100 0 v40 h-100 z"/>
  </g>

  <!-- Child silhouette -->
  <g fill="#E2792E">
    <circle cx="300" cy="380" r="18"/>
    <path d="M275 430 q25-30 50 0 v25 h-50 z"/>
  </g>

  <!-- Coffee cup -->
  <g fill="none" stroke="#2C6E68" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 470 h140 l-14 60 a20 20 0 0 1 -20 17 h-72 a20 20 0 0 1 -20 -17 z"/>
    <path d="M380 480 q30 0 30 25 q0 25 -30 25"/>
  </g>
  <path d="M255 445 q10 -18 0 -30" stroke="#4A554E" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M300 445 q10 -18 0 -30" stroke="#4A554E" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="320" y="565" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="54" letter-spacing="2" fill="#1E2A25">COINCIDE</text>
  <text x="320" y="595" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#2C6E68">Trabajo, Café &amp; Crianza</text>
</svg>
